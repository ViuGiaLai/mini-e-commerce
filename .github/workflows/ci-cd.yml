name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and build application
        run: npm run ci

      - name: Build production Docker image
        run: docker build --tag mini-e-commerce:${{ github.sha }} .

  cd:
    name: Deploy and verify Render
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://mini-e-commerce-3l2u.onrender.com
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dapq4dgu01pc73dihfg0
      APP_URL: https://mini-e-commerce-3l2u.onrender.com
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy exact commit to Render and wait
        run: node scripts/deploy-render.mjs

      - name: Verify production health
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 \
            --max-time 15 \
            "$APP_URL/api/health"
